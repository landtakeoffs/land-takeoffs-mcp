name: Tests

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the contract package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Run schema and mocked-backend tests
        run: python -m pytest --cov=land_takeoffs_contract --cov-report=term-missing --cov-fail-under=90
