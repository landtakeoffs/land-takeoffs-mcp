[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "land-takeoffs-mcp-contract"
version = "1.1.1"
description = "Schema and behavior checks for the published Land Takeoffs MCP tool contract."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=land_takeoffs_contract --cov-report=term-missing"

[tool.coverage.run]
source = ["land_takeoffs_contract"]
branch = true
